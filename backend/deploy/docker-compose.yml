# SeereonOS — single-host production-style stack: PostgreSQL 16 (ONE database) + migrate job + API + worker
# (+ optional static web app). Run from this directory:
#   cp ../.env.example .env        # fill in every CHANGE_ME (compose refuses to start without the secrets)
#   docker compose up -d --build                     # db, migrate (one-shot), api, worker
#   docker compose --profile web up -d --build       # + nginx serving ../../frontend/dist (build it first)
#   docker compose run --rm api python -m app.cli create-superadmin --email ops@example.com --name "Platform Admin"
# The images are built from the REPOSITORY ROOT (the API image copies database/migrations at build time).
# TLS terminates in front of this stack (load balancer / reverse proxy): set TRUST_PROXY=1 there.
name: seereonos

x-api-env: &api-env
  APP_ENV: production
  TZ: ${SEEREON_TZ:-Asia/Kolkata}
  # ONE connection string: the least-privilege runtime role (RLS enforced). Never the owner.
  DATABASE_URL: postgres://seereon_app:${SEEREON_APP_PASSWORD:?set SEEREON_APP_PASSWORD}@db:5432/${SEEREON_DB:-seereonos}
  APP_URL: ${APP_URL:?set APP_URL (the public https URL of the web app)}
  CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS (the exact web app origin)}
  TRUST_PROXY: ${TRUST_PROXY:-false}
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?set MFA_ENCRYPTION_KEY (openssl rand -base64 48)}
  MFA_ENCRYPTION_KEY_PREVIOUS: ${MFA_ENCRYPTION_KEY_PREVIOUS:-}
  SMTP_URL: ${SMTP_URL:-}
  MAIL_FROM: ${MAIL_FROM:-SeereonOS <no-reply@seereonos.com>}
  EMAIL_DELIVERY: ${EMAIL_DELIVERY:-}
  SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
  API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  SECURITY_EVENTS_RETENTION_DAYS: ${SECURITY_EVENTS_RETENTION_DAYS:-400}
  RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-10}
  RATE_LIMIT_GLOBAL: ${RATE_LIMIT_GLOBAL:-600}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      SEEREON_DB: ${SEEREON_DB:-seereonos}
      SEEREON_OWNER_PASSWORD: ${SEEREON_OWNER_PASSWORD:?set SEEREON_OWNER_PASSWORD}
      SEEREON_APP_PASSWORD: ${SEEREON_APP_PASSWORD:?set SEEREON_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../database/bootstrap.sql:/seereon/bootstrap.sql:ro
      - ../docker/initdb.sh:/docker-entrypoint-initdb.d/10-seereon.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${SEEREON_DB:-seereonos}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # one-shot: applies pending migrations with the OWNER credential (the only service that has it)
  migrate:
    build: { context: ../.., dockerfile: backend/Dockerfile }
    image: seereonos-api:latest
    command: ["python", "-m", "app.db.migrate"]
    environment:
      TZ: ${SEEREON_TZ:-Asia/Kolkata}
      MIGRATION_DATABASE_URL: postgres://seereon_owner:${SEEREON_OWNER_PASSWORD:?set SEEREON_OWNER_PASSWORD}@db:5432/${SEEREON_DB:-seereonos}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    image: seereonos-api:latest
    restart: unless-stopped
    environment:
      <<: *api-env
      PORT: 8000
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports:
      - "${API_PORT:-8000}:8000"
    stop_grace_period: 30s

  worker:
    image: seereonos-api:latest
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    stop_grace_period: 60s

  # optional: the built web app (frontend/dist) as static files. It calls the API at its own URL (VITE_API_BASE_URL
  # baked into the build); nginx does not proxy the API.
  web:
    profiles: ["web"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
