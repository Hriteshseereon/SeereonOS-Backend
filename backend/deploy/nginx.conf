# Static web app (frontend/dist) with SPA fallback. The app calls the API directly at its own origin (CORS), so CSP
# connect-src must name it: replace https://api.example.com (and add the Razorpay origins only if payments are on:
# script-src https://checkout.razorpay.com; frame-src https://checkout.razorpay.com https://api.razorpay.com;
# connect-src https://api.razorpay.com).
server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.example.com; frame-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # cache lifetimes via `expires` (an add_header here would drop the security headers above: nginx inheritance)
  location /assets/ { expires max; try_files $uri =404; }
  location / { expires -1; try_files $uri /index.html; }
}
